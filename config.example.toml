# GPT-SoVITS 语音插件配置模板
#
# 使用方法：
#   1. 复制本文件为 config.toml
#   2. 按注释填写 refer_wav / prompt_text / 模型权重
#   3. 重载插件
#
# 注意：config.toml 已被 .gitignore 忽略，不会提交到仓库。

[plugin]
enabled = true
config_version = "1.1.0"

[general]
# 文本最小长度，过短（如单字）合成效果差，低于此值拒绝合成
min_text_length = 2
# 文本最大长度，超过有超时风险，拒绝合成
max_text_length = 200
# true = base64 走 IPC；false = 文件路径 voiceurl
# 警告：base64 模式会把整段音频编码进消息体，该内容会作为文本进入
# MaiBot 上下文并按 token 计费，单条可达数十万 token，极易造成费用暴涨。
# 除非明确了解后果，否则请保持 false。
use_base64_audio = false
# 音频输出目录（相对项目根目录或绝对路径）
# 建议留空：留空时用 Runner 分配的插件临时目录（runtime_dir），
# 不用猜主程序装在哪，也不会污染插件仓库。
audio_output_dir = ""
# 合成失败时是否向用户发送错误提示
send_error_messages = true

# HTTP 文件服务：供远端 NapCat / OneBot 客户端拉取音频文件
# 当 NapCat 部署在另一台机器或 Docker 容器内时，远端无法访问本机文件系统（file://）。
# 开启后，插件会在后台启动轻量 HTTP 文件服务，出站语音转换为 http:// 链接，由 NapCat 自行下载转码。
enable_http_server = false
http_host = "0.0.0.0"       # 监听地址，0.0.0.0 允许局域网外部设备访问
http_port = 9885            # 监听端口
http_public_base = ""       # 对外暴露的基准 URL（如 "http://192.168.1.173:9885"），留空则自动检测本机局域网 IP


[gpt_sovits]
# GPT-SoVITS API 服务地址（不是 WebUI 的端口）
server = "http://127.0.0.1:9880"
timeout = 60

# 底模版本：决定插件允许合成哪些语言。选错会导致 400 报错或空白音频。
#   auto       按权重路径自动推断（推荐）
#   v1         支持 中文 / 英语 / 日语
#   v2ProPlus  支持 中文 / 英语 / 日语 / 粤语
#   v2 / v2Pro / v3 / v4 / v5dev / v5turbo
#              支持 中文 / 英语 / 日语 / 粤语
#
# 说明：
#   - 粤语（yue）在 v1 上不可用，v2 及以上都支持
#   - 韩语在**所有版本**上都不可用：Windows 下 text/korean.py 依赖 eunjeon
#     （mecab 韩语绑定），装不上时上游会抛出
#     "exceptions must derive from BaseException"，故统一拦截
#   - 俄语、法语、德语、泰语、阿拉伯语等所有版本都不支持
#   - 自动推断只看权重路径的文件名与直接父目录，
#     例：SoVITS_weights_v2ProPlus/azuma3_e8_s368.pth -> v2ProPlus
#   - 选 auto 时按**每个风格自己的**权重路径分别推断，
#     所以不同风格用不同版本的模型也能各自识别
#   - 推断不出时按 v2ProPlus 处理
model_version = "auto"

# 语速倍率：1.0 为原速，越大越快。
# 实测这个参数不呈线性：0.9~1.0 之间几乎听不出差别，1.2 以上才明显加快。
# 想调慢效果有限（低于 1.0 变化很小），想加快建议从 1.2 起步。
speed_factor = 1.0
# 分段之间的静音间隔（秒）。GPT-SoVITS 会把长文本按标点切成多段分别合成再拼接，
# 间隔越大句间停顿越空洞，且停顿前后会有衰减尾音和硬起音，听感像颤音。建议保持 0。
# 注意：这个参数只在「文本真的被切成多段」时才生效。cut0 不切分，设了也没用。
fragment_interval = 0.0

# ─────────────────────────────────────────────────────────────
# 文本切分（决定句与句之间有没有停顿）
# ─────────────────────────────────────────────────────────────
# 这是影响「听起来自不自然」最关键的参数。
#
#   cut0 = 不切分，整段一次合成，由模型自己决定在哪停顿
#          → 停顿最自然，但长文本容易超时或显存不足
#   cut1 = 按句号切，但「每块尽量凑够 4 句」——短句会被合并成一整块，实际不切分
#          → 短回复听起来几乎没有停顿（这是常见误区）
#   cut2/cut3/cut4 = 按标点切，块长依次递减
#   cut5 = 每个标点都切，句间停顿最明确，适合想要抑扬顿挫的场景
#          → 需要配合 fragment_interval 控制停顿长度
#
# 推荐：短句多的日常对话用 cut0；想让停顿更明显用 cut5 + fragment_interval = 0.05~0.1
text_split_method = "cut0"

# 切块的最小长度（字），短于该值的块会与相邻块合并。
# 块太短时开头起音来不及建立，听感上就是第一个字含糊。
# 16 与 GPT-SoVITS 服务端默认值一致；开头吞字明显时可调到 24~32。
min_chunk_length = 16

# 相邻块在交界处重复的字数。官方默认 2，但重复会导致某个字被念两遍。
# 如果听到交界处有重复字，保持 0。
overlap_length = 0

# ─────────────────────────────────────────────────────────────
# 采样参数（影响音色稳定性与自然度）
# ─────────────────────────────────────────────────────────────
# 采样时只保留概率最高的前 k 个候选。越低越稳定但越平淡
top_k = 15
# 核采样阈值。1.0 表示不额外截断
top_p = 1.0
# 采样温度。越高越有变化但越容易跑调，越低越平稳但可能呆板
temperature = 1.0

# ─────────────────────────────────────────────────────────────
# 自动语气：调用方未指定 style 时，按文本内容自动选择语气
# ─────────────────────────────────────────────────────────────
[gpt_sovits.auto_style]
# 关闭后，未指定 style 时固定使用 fallback
enabled = true
# 所有规则都未命中时使用的风格
# ⚠️ 必须与下方 [[gpt_sovits.styles]] 里的某个 name 完全一致。
#    写成 "default" 而风格叫「默认」时，每次都会记一条
#    「兜底风格 'default' 不在可用列表」的警告。
fallback = "默认"

# 纯数字专用风格（可选）
# 播报价格、时间、电话号码等纯数字内容时，韵律与正常说话差异较大，
# 指定专用风格往往效果更好。留空则按正常流程处理。
# 判断范围：阿拉伯数字、中文数字（一二三十百千）、小数点、负号、
#           千分位逗号，以及 年月日号点分秒元块毛角% 等数字单位。
# 启用示例：把下面的 "" 改成已有风格名，如 "数字"，
#           并确保 [[gpt_sovits.styles]] 里确实有这个 name。
number_style = ""
# 纯数字判断是否包含中文数字（一二三、十百千等）
number_style_include_chinese = true

# 自定义匹配规则（可选，可写多条）
# 自定义规则优先于插件内置规则，weight 越大优先级越高
#
# [[gpt_sovits.auto_style.rules]]
# style = "兴奋"                 # 命中后使用的风格名
# pattern = "(抽到|出货|金了)"    # Python 正则表达式，留空会被忽略
# weight = 60                    # 命中权重

# ─────────────────────────────────────────────────────────────
# 概率语音：按概率把机器人的普通文字回复自动转成语音
# ─────────────────────────────────────────────────────────────
# 开启后，机器人正常回复（不经过 LLM 工具调用）也有一定概率变成语音，
# 让对话更有「随手发语音」的自然感。
#
# 默认关闭，不影响原有行为。
#
# 与 LLM 工具调用的区别：
#   - LLM 工具（tts_voice）：由 LLM 判断内容适合语音时主动调用
#   - 本功能：LLM 照常文字回复，插件在发送前按概率拦下来改成语音
#   两者可同时使用，不冲突。
[random_voice]
# 总开关
enabled = false

# 转语音的概率：0.3 表示约三成回复会变成语音
#   0.0 = 从不  1.0 = 总是
probability = 0.3

# 同一条回复内复用随机结果的时间（秒）
# 一条长回复常被拆成多段发送，若不复用，会出现「前句语音、后句文字」
decision_ttl = 8.0

# 文本长度限制：太短（「嗯」「好」）没必要，太长（长文）语音不好听且易超时
min_text_length = 2
max_text_length = 80

# 不转语音的内容特征（正则，可写多条）。留空则使用内置规则：
#   代码块、网址、表格、Markdown 列表、HTML 标签、Markdown 链接
# 如需扩展，在此追加即可，例如：
# skip_patterns = ['```', 'https?://\\S+', '^\\s*[-*+]\\s+\\S']
skip_patterns = []

# 自动转语音时使用的风格名，留空则走自动语气选择
# 想让随机语音固定用某个语气，填该风格的 name（如 "默认"）
style = ""

# ─────────────────────────────────────────────────────────────
# 语音对讲：收到语音消息后，一段时间内的回复都用语音
# ─────────────────────────────────────────────────────────────
#
# 与「概率语音」的区别：
#   - 概率语音：每条回复掷一次骰子，决定这一条转不转语音
#   - 语音对讲：对方发了语音就进入一段「通话」，窗口内所有回复都用语音
# 两者可同时开启，语音对讲优先。
#
# 前提：宿主需开启语音识别，否则收到的语音没有文字内容。
#   位置：config/bot_config.toml -> [voice] enable_asr = true
[intercom]
# 总开关
enabled = false

# 只在私聊生效。群里连续刷语音很打扰人，默认不开。
private_only = true

# 是否需要先说唤醒词才进入对讲状态
#   false = 对方发任意一条语音就开始
#   true  = 必须先说到下面的唤醒词之一
require_wake_word = false
wake_words = ["语音对讲", "打电话", "对讲"]

# 转写文本短于该字数时不触发，避免把杂音识别成一两个字就开启
min_text_length = 1

# 语音窗口时长（秒）。对方每发一条语音都会续期。
# 超时后自动恢复文字回复。
hold_seconds = 180

# 单个回复的字数上限。语音太长既拖慢合成也容易被平台截断。
max_reply_chars = 60

# 回复超长时的处理方式
#   "text"     = 改发文字（推荐，内容完整）
#   "truncate" = 截断后仍发语音
oversize_strategy = "text"

# ─────────────────────────────────────────────────────────────
# 语音风格：每个风格是完整独立的一套参数
# ─────────────────────────────────────────────────────────────

# 必填项说明：
#   refer_wav    参考音频路径（3~10 秒、单句、干净无 BGM 的人声）
#   prompt_text  参考音频中实际说的内容，必须与音频逐字对应
#   prompt_language 参考音频的语言（zh / ja / en / ko / yue）
#
# 可选项说明：
#   gpt_weights    GPT 模型权重（相对 GPT-SoVITS 根目录），留空则用服务端当前模型
#   sovits_weights SoVITS 模型权重，留空则用服务端当前模型
#   languages      该风格适用的语言列表，留空表示通用
#   language       强制合成语言，留空则自动检测

[[gpt_sovits.styles]]
# 风格名要与 auto_style.fallback、auto_style.number_style、
# random_voice.style、内置语气规则（兴奋/吐槽/撒娇）里引用的名字对应。
# 叫「默认」时，插件会优先把它当兜底风格。
name = "默认"
refer_wav = ""                      # ← 必填，例如 "C:/path/to/reference.wav"
prompt_text = ""                    # ← 必填，例如 "今天天气不错，我们出去走走吧。"
prompt_language = "zh"
gpt_weights = ""                    # 可选，例如 "GPT_weights_v2ProPlus/model-e12.ckpt"
sovits_weights = ""                 # 可选，例如 "SoVITS_weights_v2ProPlus/model_e10.pth"

# 强制合成语言（可选）：跳过自动检测，适合纯汉字日文等无法自动区分的场景
# 留空则按文本内容自动检测。可选值：zh / ja / en / ko / yue
# language = "ja"

# ─────────────────────────────────────────────────────────────
# 语言检测说明
# ─────────────────────────────────────────────────────────────
# 插件按以下优先级自动判断语言：
#   1. 出现假名（平假名/片假名）  -> ja    中文不会出现假名，最可靠
#   2. 出现韩文                   -> ko
#   3. 出现粤语独占字             -> yue   如：唔 咁 咗 哋 佢 乜 嘢 嘅
#   4. 出现西里尔/泰文/阿拉伯文等 -> ru/th/ar 等
#   5. 纯拉丁字母                 -> en
#   6. 汉字为主                   -> zh
#
# 无法区分的情况：纯汉字的日文（如人名「東雪蓮」）会落入 zh。
# 需要精确控制时，请在该风格的配置中显式指定 language。

# ─────────────────────────────────────────────────────────────
# 多语言示例：检测到日语时自动切换到 默认_ja
# 命名规则为 <风格名>_<语言代码>，也可用 <风格名>-<语言代码>
# 注意：前缀必须与已有风格名完全一致，这里主风格叫「默认」，
#       变体就要叫「默认_ja」，写成 default_ja 不会生效。
# ─────────────────────────────────────────────────────────────
# [[gpt_sovits.styles]]
# name = "默认_ja"
# languages = ["ja"]
# refer_wav = "C:/path/to/reference_ja.wav"
# prompt_text = "おはようございます、今日もいい天気ですね。"
# prompt_language = "ja"
# gpt_weights = "GPT_weights_v2ProPlus/model_ja-e12.ckpt"
# sovits_weights = "SoVITS_weights_v2ProPlus/model_ja_e10.pth"

# ─────────────────────────────────────────────────────────────
# 多语气示例：配合自动语气规则使用
# ─────────────────────────────────────────────────────────────
# [[gpt_sovits.styles]]
# name = "兴奋"
# languages = ["zh"]
# refer_wav = "C:/path/to/reference_excited.wav"
# prompt_text = "好耶！这个真的太棒了！"
# prompt_language = "zh"
#
# [[gpt_sovits.styles]]
# name = "吐槽"
# languages = ["zh"]
# refer_wav = "C:/path/to/reference_complain.wav"
# prompt_text = "你在说什么啊，完全听不懂。"
# prompt_language = "zh"
